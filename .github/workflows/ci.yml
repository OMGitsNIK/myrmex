name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run cargo fmt
        run: cargo fmt -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
      - name: Check Rust programs
        run: cargo check

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust Dependencies
        run: cargo audit

  anchor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Solana + Anchor binaries
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: ${{ runner.os }}-solana-2.2.21-anchor-0.32.1-v1

      - name: Install Solana CLI (Agave 2.2.21)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.solana.com/v2.2.21/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install AVM and Anchor CLI 0.32.1
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y pkg-config libssl-dev
          cargo install avm --git https://github.com/coral-xyz/anchor --force
          avm install 0.32.1
          avm use 0.32.1

      - name: Add AVM binaries to PATH
        run: echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Generate localnet wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Run Anchor tests (localnet)
        run: anchor test --provider.cluster localnet

  root-node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run root lint
        run: yarn lint

  build-and-lint-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Build Website (Next.js)
        run: npm run build
      - name: Run TypeScript typecheck
        run: npm run typecheck
